<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Toy Casino</title>
    <style>
        :root {
            --gold: #ffd700;
            --purple: #4a0e78;
            --bg-dark: #0f021a;
            --bonus-color: #ff00ff;
            --cell-height: 90px;
        }

        /* Адаптивная высота ячейки для мобилок */
        @media (max-width: 600px) {
            :root { --cell-height: 60px; }
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background 0.8s ease;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            width: 100%;
            background: rgba(0,0,0,0.9);
            padding: 15px 0;
            text-align: center;
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            position: sticky; top: 0; z-index: 100;
        }

        .balance-box { font-size: 1.5rem; color: var(--gold); font-weight: 900; }

        /* ЛОББИ - Адаптивная сетка */
        #lobby {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px; padding: 20px; max-width: 1000px; width: 100%;
            box-sizing: border-box;
        }

        .game-card {
            height: 220px; border-radius: 15px; border: 2px solid #333;
            cursor: pointer; transition: 0.3s; display: flex; align-items: flex-end;
            overflow: hidden; position: relative; background-size: cover;
        }
        
        @media (min-width: 768px) {
            #lobby { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; padding: 40px; }
            .game-card { height: 300px; }
        }

        .game-card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        .game-card h3 { background: linear-gradient(transparent, rgba(0,0,0,0.9)); width: 100%; text-align: center; margin: 0; padding: 15px 0; font-size: 1.1rem; }

        /* ИГРОВОЙ ЭКРАН */
        #game-screen { display: none; flex-direction: column; align-items: center; padding: 10px; width: 100%; box-sizing: border-box; }
        
        .back-btn { align-self: flex-start; margin-bottom: 10px; padding: 8px 15px; background: #333; border: 1px solid #555; color: white; border-radius: 5px; cursor: pointer; }

        .machine-wrap {
            background: rgba(0,0,0,0.85); padding: 15px; border-radius: 20px;
            border: 4px solid var(--gold); position: relative; width: 100%; max-width: 600px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5); box-sizing: border-box;
        }

        .machine-wrap.bonus-active { border-color: var(--bonus-color); box-shadow: 0 0 40px var(--bonus-color); }

        .bg-decoration {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            font-size: 10rem; opacity: 0.07; pointer-events: none; z-index: 0;
        }

        /* СЕТКА СЛОТОВ */
        .grid {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 5px; background: #111; padding: 8px; border-radius: 10px;
            overflow: hidden; position: relative; z-index: 1;
        }

        .cell {
            height: var(--cell-height); background: #222; border-radius: 5px;
            position: relative; overflow: hidden; border: 1px solid #333;
        }

        .reel-strip {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; flex-direction: column; align-items: center;
        }

        .symbol { height: var(--cell-height); display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        @media (max-width: 600px) { .symbol { font-size: 1.5rem; } }

        /* УПРАВЛЕНИЕ - Адаптация */
        .controls { 
            display: flex; flex-direction: row; justify-content: space-between; 
            align-items: center; margin-top: 15px; gap: 10px; 
        }

        @media (max-width: 480px) {
            .controls { flex-direction: column; }
            .bet-selector { width: 100%; justify-content: center; box-sizing: border-box; }
            .spin-btn { width: 100%; }
        }
        
        .bet-selector { 
            display: flex; align-items: center; gap: 10px; background: #000; 
            padding: 8px 15px; border-radius: 12px; border: 2px solid var(--gold); 
        }
        .bet-btn { background: var(--gold); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        .spin-btn {
            flex-grow: 1; padding: 12px; background: linear-gradient(#4caf50, #2e7d32);
            border: 2px solid white; color: white; font-size: 1.3rem; font-weight: bold; border-radius: 12px; cursor: pointer;
            text-transform: uppercase;
        }
        .spin-btn.bonus { background: linear-gradient(#ff00ff, #8a008a); }
        .spin-btn:disabled { opacity: 0.5; }

        .win-anim {
            animation: win-pulse 0.5s infinite alternate !important;
            border: 2px solid var(--gold) !important;
            background: rgba(255, 215, 0, 0.2) !important;
            z-index: 10;
        }
        @keyframes win-pulse { 
            from { transform: scale(1); } 
            to { transform: scale(1.03); box-shadow: inset 0 0 15px var(--gold); } 
        }

        #bonus-counter { display: none; font-size: 1.5rem; color: var(--bonus-color); font-weight: 900; margin-bottom: 5px; text-shadow: 0 0 10px var(--bonus-color); }
        #status { margin-top: 10px; height: 20px; color: var(--gold); font-weight: bold; font-size: 1rem; text-transform: uppercase; }
    </style>
</head>
<body>

<header>
    <div class="balance-box"><span id="balance">1000.00</span> BYN</div>
</header>

<div id="lobby">
    <div class="game-card" style="background:#2b0347" onclick="openGame('diamonds')"><h3>Diamonds 💎</h3></div>
    <div class="game-card" style="background:#064e3b" onclick="openGame('pirate')"><h3>Pirates 🏴‍☠️</h3></div>
    <div class="game-card" style="background:#1e3a8a" onclick="openGame('fruits')"><h3>Fruits 🍎</h3></div>
    <div class="game-card" style="background:#1e1b4b" onclick="openGame('space')"><h3>Space 🚀</h3></div>
    <div class="game-card" style="background:#7f1d1d" onclick="openGame('neon')"><h3>Neon 777 ⚡</h3></div>
</div>

<div id="game-screen">
    <button class="back-btn" onclick="exitGame()">⬅ В МЕНЮ</button>
    <div id="bonus-counter">БОНУСЫ: <span id="fs-count">0</span></div>
    <div class="machine-wrap" id="machine">
        <div class="bg-decoration" id="bg-icon"></div>
        <h3 id="game-title" style="margin-top:0; position:relative; z-index:1; text-align: center;">Игра</h3>
        <div class="grid" id="slot-grid"></div>
        <div class="controls">
            <div class="bet-selector">
                <button class="bet-btn" onclick="changeBet(-1)">-</button>
                <div style="text-align:center; min-width: 70px; font-size: 0.8rem;">СТАВКА<br><b id="current-bet">1.00</b></div>
                <button class="bet-btn" onclick="changeBet(1)">+</button>
            </div>
            <button class="spin-btn" id="spin-btn" onclick="startSpin()">ИГРАТЬ</button>
        </div>
        <div id="status" style="text-align: center;"></div>
    </div>
</div>

<script>
    let balance = 1000.00;
    let bet = 1.00;
    const betSteps = [0.2, 1, 5, 10, 50, 100];
    let betIdx = 1;
    let currentGame = null;
    let freeSpins = 0;

    const gameConfigs = {
        diamonds: { title: "Double Success", symbols: ['💎','💎','🔔','🍒','🍇','🍋','🍊'], scatter: '⭐', color: '#4a0e78', icon: '💎' },
        pirate: { title: "Pirate Luck", symbols: ['⚓','⚓','⚔️','🏴‍☠️','💰','🗺️','📦'], scatter: '💀', color: '#166534', icon: '🏴‍☠️' },
        fruits: { title: "Fruit Blast", symbols: ['🍎','🍎','🍇','🍉','🍓','🍋','🍍'], scatter: '🎁', color: '#1d4ed8', icon: '🍎' },
        space: { title: "Cosmic Stars", symbols: ['🚀','🚀','🪐','👽','☄️','🛰️','🌌'], scatter: '🛸', color: '#1e1b4b', icon: '🪐' },
        neon: { title: "Neon 777", symbols: ['7️⃣','7️⃣','💎','🔔','🍒','🍋','🍀'], scatter: '🔥', color: '#991b1b', icon: '⚡' }
    };

    function initGrid() {
        const grid = document.getElementById('slot-grid');
        grid.innerHTML = '';
        for (let i = 0; i < 15; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerHTML = `<div class="reel-strip" id="strip-${i}"><div class="symbol">❓</div></div>`;
            grid.appendChild(cell);
        }
    }

    function openGame(id) {
        currentGame = gameConfigs[id];
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        document.getElementById('game-title').innerText = currentGame.title;
        document.getElementById('bg-icon').innerText = currentGame.icon;
        document.body.style.background = `radial-gradient(circle, ${currentGame.color} 0%, #000 100%)`;
        document.getElementById('machine').style.borderColor = currentGame.color;
        initGrid();
        window.scrollTo(0,0);
    }

    function changeBet(dir) {
        if(freeSpins > 0) return;
        betIdx = Math.max(0, Math.min(betSteps.length - 1, betIdx + dir));
        bet = betSteps[betIdx];
        document.getElementById('current-bet').innerText = bet.toFixed(2);
    }

    function startSpin() {
        if (freeSpins === 0 && balance < bet) return alert("Мало средств!");
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;

        document.querySelectorAll('.cell').forEach(c => c.classList.remove('win-anim'));
        document.getElementById('status').innerText = "";

        if (freeSpins > 0) freeSpins--; else balance -= bet;
        updateUI();

        const results = [];
        const stripCount = 25;
        const cellHeight = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell-height'));

        for (let i = 0; i < 15; i++) {
            const strip = document.getElementById(`strip-${i}`);
            const isScatter = Math.random() > 0.985;
            const finalSymbol = isScatter ? currentGame.scatter : currentGame.symbols[Math.floor(Math.random() * currentGame.symbols.length)];
            results.push(finalSymbol);

            let html = '';
            for (let j = 0; j < stripCount; j++) {
                const s = currentGame.symbols[Math.floor(Math.random() * currentGame.symbols.length)];
                html += `<div class="symbol">${j === 0 ? finalSymbol : s}</div>`;
            }
            strip.innerHTML = html;
            strip.style.transition = 'none';
            strip.style.transform = `translateY(-${(stripCount - 1) * cellHeight}px)`;

            setTimeout(() => {
                strip.style.transition = `transform ${1.2 + (i%5) * 0.2}s cubic-bezier(0.15, 0.85, 0.45, 1.05)`;
                strip.style.transform = 'translateY(0px)';
            }, 50);
        }

        setTimeout(() => { checkWin(results); }, 2400);
    }

    function checkWin(res) {
        const scatters = res.filter(s => s === currentGame.scatter).length;
        const counts = {};
        res.forEach(s => counts[s] = (counts[s] || 0) + 1);
        let maxMatch = 0, winSym = '';
        for(let s in counts) { if(s !== currentGame.scatter && counts[s] > maxMatch) { maxMatch = counts[s]; winSym = s; } }

        if (scatters >= 3 && !document.getElementById('machine').classList.contains('bonus-active')) {
            startBonus(); return;
        }

        let mult = 0;
        if (maxMatch >= 9) mult = 30;
        else if (maxMatch >= 6) mult = 5;
        else if (maxMatch >= 4) mult = 1.5;

        if (mult > 0) {
            balance += bet * mult;
            document.getElementById('status').innerText = `WIN: ${(bet * mult).toFixed(2)}`;
            res.forEach((s, i) => { if(s === winSym) document.querySelectorAll('.cell')[i].classList.add('win-anim'); });
        }

        updateUI();
        if (freeSpins > 0) setTimeout(startSpin, 1200);
        else {
            document.getElementById('spin-btn').disabled = false;
            if (document.getElementById('machine').classList.contains('bonus-active')) endBonus();
        }
    }

    function startBonus() {
        freeSpins = 10;
        document.getElementById('machine').classList.add('bonus-active');
        document.getElementById('spin-btn').classList.add('bonus');
        document.getElementById('bonus-counter').style.display = "block";
        updateUI(); setTimeout(startSpin, 1000);
    }

    function endBonus() {
        document.getElementById('machine').classList.remove('bonus-active');
        document.getElementById('spin-btn').classList.remove('bonus');
        document.getElementById('bonus-counter').style.display = "none";
        document.getElementById('spin-btn').disabled = false;
    }

    function updateUI() {
        document.getElementById('balance').innerText = balance.toFixed(2);
        document.getElementById('fs-count').innerText = freeSpins;
    }

    function exitGame() {
        if(freeSpins > 0) return;
        document.getElementById('lobby').style.display = 'grid';
        document.getElementById('game-screen').style.display = 'none';
        document.body.style.background = '#0f021a';
    }

    updateUI();
</script>
</body>
</html>
