<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casino Deluxe Fullscreen</title>
    <style>
        :root {
            --gold: #ffd700;
            --bg: #0f021a;
            --bonus: #ff00ff;
            --cell-h: 22vh; /* Высота ячейки на ПК */
        }

        @media (max-width: 1024px) { :root { --cell-h: 80px; } }
        @media (max-width: 480px) { :root { --cell-h: 65px; } }

        body, html {
            height: 100%; margin: 0; padding: 0;
            background-color: var(--bg); color: white;
            font-family: 'Arial', sans-serif; overflow: hidden;
        }

        body { display: flex; flex-direction: column; }

        header {
            width: 100%; height: 60px; background: rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center;
            border-bottom: 2px solid var(--gold); z-index: 100;
        }
        .balance-box { font-size: 1.6rem; color: var(--gold); font-weight: bold; }

        /* МОДАЛКИ */
        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: linear-gradient(135deg, #2b0347, #4a0e78); padding: 40px;
            border-radius: 30px; border: 4px solid var(--gold); text-align: center;
            width: 320px; box-shadow: 0 0 60px var(--bonus);
        }
        .modal-btn {
            margin-top: 25px; padding: 15px 40px; background: var(--gold);
            border: none; border-radius: 50px; font-weight: bold; cursor: pointer;
            font-size: 1.2rem; text-transform: uppercase;
        }

        /* ЛОББИ */
        #lobby {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; padding: 30px; width: 100%; max-width: 1200px;
            margin: auto; box-sizing: border-box; overflow-y: auto;
        }
        .game-card {
            height: 250px; border-radius: 20px; border: 3px solid #333; cursor: pointer;
            display: flex; align-items: flex-end; overflow: hidden; background-size: cover;
            background-position: center; position: relative; transition: 0.3s;
        }
        .game-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .game-card h3 { background: rgba(0,0,0,0.8); width: 100%; text-align: center; margin: 0; padding: 15px; font-size: 1rem; }

        /* ИГРОВОЙ ЭКРАН */
        #game-screen {
            display: none; flex-direction: column; width: 100%; height: calc(100vh - 60px);
            position: relative; align-items: center; justify-content: center;
        }

        .back-btn { position: absolute; top: 15px; left: 15px; padding: 10px 20px; background: #333; border: 1px solid #555; color: white; border-radius: 10px; cursor: pointer; z-index: 10; }

        /* МАШИНА */
        .machine-wrap {
            position: relative; width: 100%; max-width: 1100px;
            display: flex; flex-direction: column; align-items: center;
            padding: 0 50px; box-sizing: border-box;
        }

        /* ЦИФРЫ ЛИНИЙ - ТЕПЕРЬ ПРИВЯЗАНЫ К РЯДАМ ГРИДА */
        .side-panel {
            position: absolute; top: 0; height: calc(var(--cell-h) * 3 + 20px); /* Высота сетки */
            display: flex; flex-direction: column; justify-content: space-around; width: 40px;
        }
        .left-panel { left: 5px; }
        .right-panel { right: 5px; }
        .lnum {
            width: 30px; height: 24px; background: #111; font-size: 0.75rem;
            display: flex; align-items: center; justify-content: center;
            border-radius: 5px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold;
        }

        .grid-container {
            width: 100%; background: rgba(0,0,0,0.85); border: 4px solid var(--gold);
            border-radius: 20px; padding: 10px; box-sizing: border-box; transition: 0.5s;
        }
        .bonus-active .grid-container { border-color: var(--bonus); box-shadow: 0 0 50px var(--bonus); }

        .grid {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 8px; background: #000; padding: 5px; border-radius: 12px; overflow: hidden;
        }

        .cell {
            height: var(--cell-h); background: linear-gradient(#222, #111);
            border: 1px solid #333; border-radius: 8px; position: relative; overflow: hidden;
        }

        .reel-strip { position: absolute; top: 0; left: 0; width: 100%; display: flex; flex-direction: column; }
        .symbol { height: var(--cell-h); display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell-h) * 0.6); }

        /* ПАНЕЛЬ УПРАВЛЕНИЯ */
        .controls {
            width: 100%; max-width: 1000px; display: flex; justify-content: space-between;
            align-items: center; margin-top: 30px; padding: 0 20px; box-sizing: border-box;
        }
        @media (max-width: 600px) { .controls { flex-direction: column; gap: 15px; margin-top: 15px; } }

        .bet-selector {
            display: flex; align-items: center; gap: 15px; background: #000;
            padding: 10px 25px; border-radius: 15px; border: 2px solid var(--gold);
        }
        .bet-btn { background: var(--gold); border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 1.2rem; }

        .spin-btn {
            padding: 18px 60px; background: linear-gradient(#44cc44, #1a881a);
            border: 2px solid #fff; color: white; font-size: 1.5rem; font-weight: 900;
            border-radius: 15px; cursor: pointer; text-transform: uppercase; transition: 0.1s;
        }
        .spin-btn:active { transform: translateY(3px); }
        .spin-btn:disabled { opacity: 0.4; filter: grayscale(1); }

        .win-active { animation: win-pulse 0.5s infinite alternate !important; border: 3px solid var(--gold) !important; background: rgba(255, 215, 0, 0.2) !important; z-index: 10; }
        @keyframes win-pulse { from { transform: scale(1); } to { transform: scale(1.05); box-shadow: inset 0 0 20px var(--gold); } }

        #status { margin-top: 15px; color: var(--gold); font-weight: bold; text-align: center; font-size: 1.5rem; min-height: 30px; text-shadow: 0 0 10px black; }
        #bonus-info { display: none; color: var(--bonus); font-size: 1.5rem; font-weight: 900; text-align: center; text-shadow: 0 0 15px var(--bonus); margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="modal-overlay">
    <div class="modal-content">
        <h1 id="modal-title"></h1>
        <p id="modal-text"></p>
        <button class="modal-btn" id="modal-btn">Продолжить</button>
    </div>
</div>

<header>
    <div class="balance-box">БАЛАНС: <span id="balance">1000.00</span> BYN</div>
</header>

<div id="lobby">
    <div class="game-card" style="background-image:linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)), url('https://freepik.com')" onclick="openGame('book')"><h3>Treasure Book 📖</h3></div>
    <div class="game-card" style="background:#2b0347" onclick="openGame('diamonds')"><h3>Double Success 💎</h3></div>
    <div class="game-card" style="background:#064e3b" onclick="openGame('pirate')"><h3>Pirate Luck 🏴‍☠️</h3></div>
    <div class="game-card" style="background:#1e3a8a" onclick="openGame('fruits')"><h3>Fruit Blast 🍎</h3></div>
    <div class="game-card" style="background:#1e1b4b" onclick="openGame('space')"><h3>Cosmic Stars 🚀</h3></div>
    <div class="game-card" style="background:#7f1d1d" onclick="openGame('neon')"><h3>Neon 777 ⚡</h3></div>
</div>

<div id="game-screen">
    <button class="back-btn" onclick="exitGame()">⬅ МЕНЮ</button>
    <div id="bonus-info">БОНУС: <span id="fs-count">0</span> | ВЫИГРЫШ: <span id="fs-total-win">0.00</span></div>
    
    <div class="machine-wrap" id="machine-wrapper">
        <div class="side-panel left-panel" id="l-nums"></div>
        <div class="grid-container">
            <div class="grid" id="slot-grid"></div>
        </div>
        <div class="side-panel right-panel" id="r-nums"></div>
    </div>

    <div class="controls">
        <div class="bet-selector">
            <button class="bet-btn" onclick="changeBet(-1)">-</button>
            <div style="text-align:center; min-width:70px; font-size:0.8rem;">СТАВКА<br><b id="display-bet">0.50</b></div>
            <button class="bet-btn" onclick="changeBet(1)">+</button>
        </div>
        <button class="spin-btn" id="spin-btn" onclick="handleSpin()">ИГРАТЬ</button>
    </div>
    <div id="status"></div>
</div>

<script>
    // --- ЗВУКИ ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playSfx(f, t, d) {
        try {
            if (!audioCtx) audioCtx = new AudioCtx();
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + d);
        } catch(e){}
    }
    const playWin = () => { playSfx(880, 'sine', 0.2); setTimeout(()=>playSfx(1046, 'sine', 0.2), 100); };
    const playBonus = () => [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playSfx(f, 'square', 0.3), i * 120));

    // --- ПЕРЕМЕННЫЕ ---
    let balance = parseFloat(localStorage.getItem('casino_bal')) || 1000.00;
    let bet = 0.50;
    const bets = [0.10, 0.50, 1.00, 2.00, 5.00, 10.00, 50.00];
    let betIdx = 1, isSpinning = false, freeSpins = 0, currentBonusWin = 0, currentGame = null;

    const gameConfigs = {
        book: { title: "Treasure Book", symbols: [{char:'🤠', val: 500}, {char:'👺', val: 200}, {char:'🪲', val: 75}, {char:'🏺', val: 50}, {char:'A', val: 15}, {char:'K', val: 10}], scatter: '📖', color: '#784a0e' },
        diamonds: { title: "Double Success", symbols: [{char:'💎', val: 300}, {char:'7️⃣', val: 150}, {char:'🔔', val: 100}, {char:'🍇', val: 50}, {char:'🍒', val: 20}], scatter: '⭐', color: '#2b0347' },
        pirate: { title: "Pirate Luck", symbols: [{char:'🏴‍☠️', val: 400}, {char:'💰', val: 200}, {char:'⚔️', val: 100}, {char:'⚓', val: 50}, {char:'🗝️', val: 10}], scatter: '🦜', color: '#064e3b' },
        fruits: { title: "Fruit Blast", symbols: [{char:'🍎', val: 200}, {char:'🍉', val: 100}, {char:'🍓', val: 50}, {char:'🍇', val: 20}, {char:'🍒', val: 5}], scatter: '🎁', color: '#1d4ed8' },
        space: { title: "Cosmic Stars", symbols: [{char:'🛸', val: 500}, {char:'🚀', val: 200}, {char:'🪐', val: 100}, {char:'👽', val: 50}, {char:'☄️', val: 10}], scatter: '🌌', color: '#1e1b4b' },
        neon: { title: "Neon 777", symbols: [{char:'7️⃣', val: 500}, {char:'💎', val: 200}, {char:'🔔', val: 100}, {char:'🍀', val: 50}, {char:'🍒', val: 10}], scatter: '🔥', color: '#7f1d1d' }
    };

    const paylines = [
        [5,6,7,8,9], [0,1,2,3,4], [10,11,12,13,14], // Ряды
        [0,6,12,8,4], [10,6,2,6,10], // Зигзаги
        [0,1,7,13,14], [10,11,7,3,4], // Ступеньки
        [5,1,2,3,9], [5,11,12,13,9], [0,6,7,8,4] // Углы
    ];

    function openGame(id) {
        currentGame = gameConfigs[id];
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        document.body.style.background = `radial-gradient(circle, ${currentGame.color} 0%, #000 100%)`;
        initGrid(); initInterface(); updateUI();
    }

    function initInterface() {
        const nums = [4, 2, 8, 1, 10, 6, 9, 7, 3, 5];
        document.getElementById('l-nums').innerHTML = document.getElementById('r-nums').innerHTML = 
            nums.map(n => `<div class="lnum">${n}</div>`).join('');
    }

    function initGrid() {
        const g = document.getElementById('slot-grid'); g.innerHTML = '';
        for (let i = 0; i < 15; i++) g.innerHTML += `<div class="cell"><div class="reel-strip" id="s-${i}"><div class="symbol">?</div></div></div>`;
    }

    function changeBet(v) {
        if (isSpinning || freeSpins > 0) return;
        betIdx = Math.max(0, Math.min(bets.length - 1, betIdx + v));
        bet = bets[betIdx]; document.getElementById('display-bet').innerText = bet.toFixed(2);
    }

    function handleSpin() {
        if (isSpinning || (balance < bet && freeSpins === 0)) return;
        isSpinning = true;
        if (freeSpins > 0) freeSpins--;
        else { balance -= bet; localStorage.setItem('casino_bal', balance); }
        updateUI();
        document.getElementById('spin-btn').disabled = true;
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('win-active'));

        const res = [];
        const cellH = document.querySelector('.cell').offsetHeight;
        const stripCount = 30;

        for (let i = 0; i < 15; i++) {
            const strip = document.getElementById(`s-${i}`);
            const isScatter = Math.random() > 0.985;
            const sym = isScatter ? currentGame.scatter : currentGame.symbols[Math.floor(Math.random()*currentGame.symbols.length)].char;
            res[i] = sym;

            let html = '';
            for (let j = 0; j < stripCount; j++) {
                const s = currentGame.symbols[Math.floor(Math.random()*currentGame.symbols.length)].char;
                html += `<div class="symbol">${j===0 ? sym : s}</div>`;
            }
            strip.innerHTML = html;
            strip.style.transition = 'none';
            strip.style.transform = `translateY(-${(stripCount-1) * cellH}px)`;

            requestAnimationFrame(() => {
                setTimeout(() => {
                    strip.style.transition = `transform ${1.4 + (i%5)*0.2}s cubic-bezier(0.15, 0, 0.1, 1)`;
                    strip.style.transform = 'translateY(0px)';
                }, 50);
            });
        }
        setTimeout(() => checkWins(res), 2800);
    }

    function checkWins(res) {
        let winTotal = 0;
        const scatters = res.filter(s => s === currentGame.scatter).length;
        paylines.forEach(line => {
            let match = 1, first = res[line[0]];
            if (first === currentGame.scatter) return;
            for (let i = 1; i < 5; i++) { if (res[line[i]] === first) match++; else break; }
            if (match >= 3) {
                const data = currentGame.symbols.find(s => s.char === first);
                let mult = match === 3 ? 1 : (match === 4 ? 5 : 20);
                winTotal += (data.val / 10) * mult * bet;
                for (let i = 0; i < match; i++) document.querySelectorAll('.cell')[line[i]].classList.add('win-active');
            }
        });

        if (winTotal > 0) {
            playWin();
            if (freeSpins > 0 || (scatters >= 3 && freeSpins === 0)) currentBonusWin += winTotal;
            else { balance += winTotal; localStorage.setItem('casino_bal', balance); }
            document.getElementById('status').innerText = `WIN: ${winTotal.toFixed(2)} BYN`;
        }

        if (scatters >= 3 && freeSpins === 0) {
            isSpinning = false; playBonus();
            showModal("ПОЗДРАВЛЯЕМ!", "Вы получили 10 БОНУСНЫХ ИГР!", "Играть", () => {
                freeSpins = 10; currentBonusWin = 0;
                document.getElementById('machine-wrapper').parentElement.classList.add('bonus-active');
                updateUI(); handleSpin();
            }); return;
        }

        isSpinning = false; updateUI();
        if (freeSpins > 0) setTimeout(handleSpin, 1200);
        else if (document.getElementById('machine-wrapper').parentElement.classList.contains('bonus-active')) {
            showModal("ИТОГ БОНУСА", `Вы выиграли: ${currentBonusWin.toFixed(2)} BYN`, "ЗАБРАТЬ", () => {
                balance += currentBonusWin; localStorage.setItem('casino_bal', balance);
                currentBonusWin = 0; document.getElementById('machine-wrapper').parentElement.classList.remove('bonus-active');
                document.getElementById('spin-btn').disabled = false; updateUI();
            });
        } else document.getElementById('spin-btn').disabled = false;
    }

    function showModal(t, txt, bt, cb) {
        document.getElementById('modal-title').innerText = t;
        document.getElementById('modal-text').innerText = txt;
        const b = document.getElementById('modal-btn'); b.innerText = bt;
        b.onclick = () => { document.getElementById('modal-overlay').style.display = 'none'; cb(); };
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function updateUI() {
        document.getElementById('balance').innerText = balance.toFixed(2);
        const info = document.getElementById('bonus-info');
        if (freeSpins > 0 || (isSpinning && document.getElementById('machine-wrapper').parentElement.classList.contains('bonus-active'))) {
            info.style.display = 'block'; document.getElementById('fs-count').innerText = freeSpins;
            document.getElementById('fs-total-win').innerText = currentBonusWin.toFixed(2);
        } else info.style.display = 'none';
    }

    function exitGame() {
        if (isSpinning || freeSpins > 0) return;
        document.getElementById('lobby').style.display = 'grid';
        document.getElementById('game-screen').style.display = 'none';
        document.body.style.background = '#0f021a';
    }
    updateUI();
</script>
</body>
</html>
