<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casino Peak Final</title>
    <style>
        :root {
            --gold: #ffd700;
            --bg-grad: radial-gradient(circle, #3d2b01 0%, #000000 100%);
            --win-green: #2ecc71;
            --cell-h: 80px;
        }

        @media (max-width: 480px) { :root { --cell-h: 64px; } }
        @media (min-width: 1025px) { :root { --cell-h: 18vh; } }

        body, html {
            height: 100%; margin: 0; padding: 0;
            background: var(--bg-grad); color: white;
            font-family: 'Arial Black', sans-serif;
            overflow-x: hidden; -webkit-tap-highlight-color: transparent;
        }

        header { width: 100%; padding: 15px 0; text-align: center; background: rgba(0,0,0,0.6); border-bottom: 1px solid #543d01; }
        .balance-box { font-size: 1.6rem; color: var(--gold); font-weight: 900; }

        /* ЛОББИ - КРУПНЫЕ КАРТОЧКИ НА ПК */
        #lobby {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; padding: 25px; max-width: 1200px; margin: auto; 
            box-sizing: border-box; overflow-y: auto;
        }
        @media (max-width: 480px) { #lobby { grid-template-columns: repeat(2, 1fr); gap: 12px; } }

        .game-card {
            height: 180px; border-radius: 15px; border: 2px solid #543d01; cursor: pointer;
            display: flex; align-items: flex-end; overflow: hidden; background-size: cover; background-position: center; transition: 0.3s;
        }
        .game-card:hover { border-color: var(--gold); transform: scale(1.03); }
        .game-card h3 { background: rgba(0,0,0,0.85); width: 100%; text-align: center; margin: 0; padding: 10px; font-size: 0.7rem; color: var(--gold); text-transform: uppercase; }

        /* ИГРОВОЙ ЭКРАН */
        #game-screen { display: none; flex-direction: column; width: 100%; height: calc(100vh - 65px); align-items: center; justify-content: center; }
        .back-btn { position: absolute; top: 75px; left: 15px; padding: 6px 12px; background: #111; color: #ccc; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-size: 0.65rem; z-index: 100; }

        /* КОМПОНОВКА */
        .game-container { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 1000px; }
        @media (max-width: 1024px) { .game-container { flex-direction: column; } }

        /* КОЛЕСО */
        #talisman-wheel-box { display: none; position: relative; width: 180px; height: 180px; margin-bottom: 10px; }
        @media (min-width: 1025px) { #talisman-wheel-box { width: 35vh; height: 35vh; margin-right: 20px; } }
        #talisman-wheel { width: 100%; height: 100%; border-radius: 50%; border: 5px solid var(--gold); transition: transform 3.5s cubic-bezier(0.1, 0, 0.1, 1); background: conic-gradient(#d32f2f 0 72deg, #2e7d32 72deg 144deg, #1976d2 144deg 216deg, #ff9800 216deg 288deg, #ff00ff 288deg 360deg); position: relative; }
        .sector-text { position: absolute; width: 100%; height: 100%; text-align: center; font-weight: 900; color: white; padding-top: 15px; font-size: 0.8rem; pointer-events: none; }
        .wheel-ptr { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid var(--gold); z-index: 10; }

        /* СЛОТЫ */
        .side-panel { display: flex; flex-direction: column; justify-content: space-around; height: calc(var(--cell-h) * 3 + 25px); width: 28px; }
        .lnum { width: 24px; height: 18px; background: #000; border: 1px solid var(--gold); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: var(--gold); font-weight: bold; }
        .grid-frame { background: #000; border: 3px solid var(--gold); border-radius: 15px; padding: 8px; flex-grow: 1; max-width: 600px; position: relative; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; border-radius: 8px; overflow: hidden; }
        .cell { height: var(--cell-h); background: #1a1a1a; position: relative; overflow: hidden; border: 1px solid #222; }
        .reel-strip { position: absolute; width: 100%; display: flex; flex-direction: column; }
        .symbol { height: var(--cell-h); display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell-h) * 0.6); }

        /* КНОПКИ (КАПСУЛЫ) */
        .controls { display: flex; align-items: center; justify-content: center; gap: 15px; width: 95%; max-width: 750px; margin-top: 20px; }
        .bet-capsule { display: flex; align-items: center; justify-content: space-between; background: #000; border: 2.5px solid var(--gold); border-radius: 40px; padding: 5px 15px; width: 160px; flex-shrink: 0; }
        .bet-btn { background: var(--gold); border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: 900; cursor: pointer; color: black; font-size: 1.2rem; }
        .bet-info { text-align: center; font-size: 0.6rem; color: #fff; text-transform: uppercase; }
        .bet-info b { display: block; font-size: 0.9rem; }
        .spin-btn { flex-grow: 1; padding: 20px; border-radius: 15px; border: 2.5px solid #fff; background: linear-gradient(to bottom, #44cc44, #1a881a); color: white; font-size: 1.6rem; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .spin-btn:disabled { opacity: 0.5; filter: grayscale(1); }

        #win-tag { margin-top: 10px; color: var(--gold); font-weight: 900; font-size: 1.4rem; min-height: 30px; }
        .win-active { border: 2px solid var(--gold) !important; background: rgba(255, 215, 0, 0.25) !important; animation: flash 0.5s infinite alternate; }
        @keyframes flash { from { opacity: 1; } to { opacity: 0.6; } }

        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 5000; justify-content: center; align-items: center; }
        .modal-content { background: #111; padding: 30px; border-radius: 20px; border: 3px solid var(--gold); text-align: center; width: 80%; max-width: 320px; }
    </style>
</head>
<body>

<div id="modal-overlay">
    <div class="modal-content">
        <h2 id="modal-title" style="color:var(--gold)">БОНУС!</h2>
        <p id="modal-text"></p>
        <button onclick="closeModal()" style="margin-top:20px; padding:12px 30px; background:var(--gold); border:none; border-radius:50px; font-weight:bold; cursor:pointer;">ОК</button>
    </div>
</div>

<header><div class="balance-box">БАЛАНС: <span id="balance">1000.00</span> BYN</div></header>

<div id="lobby">
    <div class="game-card" style="background:#8b0000" onclick="openGame('talisman')"><h3>TALISMAN LUCK 🧧</h3></div>
    <div class="game-card" style="background:#064e3b" onclick="openGame('roulette')"><h3>РУЛЕТКА 🎡</h3></div>
    <div class="game-card" style="background-image:url('https://freepik.com')" onclick="openGame('book')"><h3>TREASURE BOOK 📖</h3></div>
    <div class="game-card" style="background:#2b0347" onclick="openGame('diamonds')"><h3>SUCCESS 💎</h3></div>
    <div class="game-card" style="background-image:url('https://freepik.com')" onclick="openGame('space')"><h3>COSMIC STARS 🚀</h3></div>
    <div class="game-card" style="background:#1e3a8a" onclick="openGame('fruits')"><h3>FRUITS 🍎</h3></div>
    <div class="game-card" style="background:#064e3b" onclick="openGame('pirate')"><h3>PIRATE LUCK 🏴‍☠️</h3></div>
    <div class="game-card" style="background:#7f1d1d" onclick="openGame('neon')"><h3>NEON 777 ⚡</h3></div>
</div>

<div id="game-screen">
    <button class="back-btn" onclick="exitGame()">← ЛОББИ</button>
    <div class="game-container">
        <div id="talisman-wheel-box">
            <div class="wheel-ptr"></div>
            <div id="talisman-wheel">
                <div class="sector-text" style="transform: rotate(36deg)">x2</div>
                <div class="sector-text" style="transform: rotate(108deg)">x5</div>
                <div class="sector-text" style="transform: rotate(180deg)">x10</div>
                <div class="sector-text" style="transform: rotate(252deg)">10 FS</div>
                <div class="sector-text" style="transform: rotate(324deg)">15 FS</div>
            </div>
        </div>
        <div id="slot-ui-wrap" style="display:flex; align-items:center; gap:8px;">
            <div class="side-panel" id="l-nums"></div>
            <div class="grid-frame"><div class="grid" id="slot-grid"></div></div>
            <div class="side-panel" id="r-nums"></div>
        </div>
        <div id="roulette-ui" style="display:none; flex-direction:column; align-items:center;">
            <div style="position:relative; width:240px; height:240px;">
                <div class="wheel-ptr" style="top:-20px;"></div>
                <div id="rou-wheel" style="width:100%; height:100%; border-radius:50%; transition:4s ease-out;"></div>
            </div>
            <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px; width:280px; margin-top:20px;">
                <div class="bet-opt" id="r-red" style="color:#ff4444; background:#111; padding:12px; border-radius:10px; text-align:center; border:1px solid #444; cursor:pointer;" onclick="setRouBet('red')">КРАСНОЕ</div>
                <div class="bet-opt" id="r-black" style="color:#aaa; background:#111; padding:12px; border-radius:10px; text-align:center; border:1px solid #444; cursor:pointer;" onclick="setRouBet('black')">ЧЕРНОЕ</div>
                <div class="bet-opt" id="r-zero" style="grid-column:span 2; color:#44cc44; background:#111; padding:12px; border-radius:10px; text-align:center; border:1px solid #444; cursor:pointer;" onclick="setRouBet('zero')">ЗЕРО (x36)</div>
            </div>
        </div>
    </div>
    <div class="controls">
        <div class="bet-capsule">
            <button onclick="changeBet(-1)" class="bet-btn">-</button>
            <div class="bet-info">СТАВКА <b id="display-bet">0.50</b></div>
            <button onclick="changeBet(1)" class="bet-btn">+</button>
        </div>
        <button class="spin-btn" id="spin-btn" onclick="handlePlay()">ИГРАТЬ</button>
    </div>
    <div id="win-tag"></div>
</div>

<script>
    let balance = parseFloat(localStorage.getItem('casino_bal')) || 1000.00;
    let betIdx = 1;
    const bets = [0.10, 0.50, 1.00, 10.00, 50.00, 100.00, 500.00];
    let isPlaying = false, currentGame = null, rouBet = null, freeSpins = 0;
    let talRot = 0, rouRot = 0;

    const paylines = [
        [5, 6, 7, 8, 9], [0, 1, 2, 3, 4], [10, 11, 12, 13, 14],
        [5, 1, 7, 3, 9], [0, 6, 2, 8, 4], [5, 11, 7, 13, 9],
        [10, 6, 12, 8, 14], [0, 1, 7, 13, 14], [10, 11, 7, 3, 4], [5, 6, 2, 8, 9]
    ];

    const sideNums = [4, 2, 8, 1, 10, 6, 9, 7, 3, 5];
    const wheelNums = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];

    const gameConfigs = {
        talisman: { symbols:[{char:'🐼', val:500},{char:'🏮', val:200}], scatter:'🧧', coin:'🪙' },
        book: { symbols:[{char:'🤠', val:500},{char:'👺', val:200}], scatter:'📖' },
        diamonds: { symbols:[{char:'💎', val:500},{char:'7️⃣', val:200}], scatter:'⭐' },
        space: { symbols:[{char:'👽', val:500},{char:'🚀', val:200}], scatter:'🛸' },
        fruits: { symbols:[{char:'🍎', val:500},{char:'🍒', val:200}], scatter:'🎁' },
        pirate: { symbols:[{char:'🏴‍☠️', val:500},{char:'⚔️', val:200}], scatter:'🦜' },
        neon: { symbols:[{char:'7️⃣', val:500},{char:'🔔', val:200}], scatter:'🔥' }
    };

    function openGame(id) {
        if (id === 'roulette') {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('roulette-ui').style.display = 'flex';
            document.getElementById('slot-ui-wrap').style.display = 'none';
            document.getElementById('talisman-wheel-box').style.display = 'none';
            document.getElementById('rou-wheel').style.background = "conic-gradient(#2e7d32 0deg 9.7deg, #d32f2f 9.7deg 19.4deg, #212121 19.4deg 29.1deg, #d32f2f 29.1deg 38.8deg, #212121 38.8deg 48.5deg, #d32f2f 48.5deg 58.2deg, #212121 58.2deg 67.9deg, #d32f2f 67.9deg 77.6deg, #212121 77.6deg 87.3deg, #d32f2f 87.3deg 97deg, #212121 97deg 106.7deg, #d32f2f 106.7deg 116.4deg, #212121 116.4deg 126.1deg, #d32f2f 126.1deg 135.8deg, #212121 135.8deg 145.5deg, #d32f2f 145.5deg 155.2deg, #212121 155.2deg 164.9deg, #d32f2f 164.9deg 174.6deg, #212121 174.6deg 184.3deg, #d32f2f 184.3deg 194deg, #212121 194deg 203.7deg, #d32f2f 203.7deg 213.4deg, #212121 213.4deg 223.1deg, #d32f2f 223.1deg 232.8deg, #212121 232.8deg 242.5deg, #d32f2f 242.5deg 252.2deg, #212121 252.2deg 261.9deg, #d32f2f 261.9deg 271.6deg, #212121 271.6deg 281.3deg, #d32f2f 281.3deg 291deg, #212121 291deg 300.7deg, #d32f2f 300.7deg 310.4deg, #212121 310.4deg 320.1deg, #d32f2f 320.1deg 329.8deg, #212121 329.8deg 339.5deg, #d32f2f 339.5deg 349.2deg, #212121 349.2deg 360deg)";
            currentGame = { type: 'roulette' };
        } else {
            currentGame = gameConfigs[id];
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('roulette-ui').style.display = 'none';
            document.getElementById('slot-ui-wrap').style.display = 'flex';
            document.getElementById('talisman-wheel-box').style.display = (id === 'talisman') ? 'block' : 'none';
            initGrid(); initLines();
        }
        updateUI();
    }

    function initGrid() {
        const g = document.getElementById('slot-grid'); g.innerHTML = '';
        for (let i = 0; i < 15; i++) g.innerHTML += `<div class="cell"><div class="reel-strip" id="s-${i}"><div class="symbol">?</div></div></div>`;
    }

    function initLines() {
        const html = sideNums.map(n => `<div class="lnum">${n}</div>`).join('');
        document.getElementById('l-nums').innerHTML = document.getElementById('r-nums').innerHTML = html;
    }

    function changeBet(v) { if (!isPlaying) { betIdx = Math.max(0, Math.min(bets.length - 1, betIdx + v)); updateUI(); } }
    function setRouBet(t) { if (!isPlaying) { rouBet = t; document.querySelectorAll('.bet-opt').forEach(el => el.style.borderColor = '#444'); document.getElementById('r-'+t).style.borderColor = 'var(--gold)'; } }

    function handlePlay() {
        if (isPlaying || (balance < bets[betIdx] && freeSpins === 0)) return;
        isPlaying = true; document.getElementById('spin-btn').disabled = true; document.getElementById('win-tag').innerText = "";
        if (currentGame.type === 'roulette') spinRoulette(); else spinSlots();
    }

    function spinSlots() {
        if (freeSpins > 0) freeSpins--; else balance -= bets[betIdx];
        updateUI(); document.querySelectorAll('.cell').forEach(c => c.classList.remove('win-active'));
        const res = []; const cellH = document.querySelector('.cell').offsetHeight;
        for (let i = 0; i < 15; i++) {
            const strip = document.getElementById(`s-${i}`);
            let sym = (Math.random() > 0.98) ? currentGame.scatter : (Math.random() > 0.95 && currentGame.coin ? currentGame.coin : currentGame.symbols[Math.floor(Math.random()*currentGame.symbols.length)].char);
            res[i] = sym;
            let h = ''; for (let j = 0; j < 30; j++) h += `<div class="symbol">${j===0?sym:currentGame.symbols[Math.floor(Math.random()*currentGame.symbols.length)].char}</div>`;
            strip.innerHTML = h; strip.style.transition = 'none'; strip.style.transform = `translateY(-${29 * cellH}px)`;
            setTimeout(() => { strip.style.transition = `transform ${1.3+(i%5)*0.12}s cubic-bezier(0.1, 0.9, 0.2, 1)`; strip.style.transform = 'translateY(0px)'; }, 50);
        }
        setTimeout(() => checkWins(res), 2800);
    }

    function checkWins(res) {
        let win = 0;
        paylines.forEach(line => {
            let match = 1, first = res[line[0]];
            for (let i = 1; i < 5; i++) { if (res[line[i]] === first) match++; else break; }
            if (match >= 3 && first !== currentGame.scatter && first !== currentGame.coin) {
                win += (match === 3 ? 1 : match === 4 ? 5 : 20) * bets[betIdx];
                for (let i = 0; i < match; i++) document.querySelectorAll('.cell')[line[i]].classList.add('win-active');
            }
        });
        balance += win; if (win > 0) document.getElementById('win-tag').innerText = `WIN: ${win.toFixed(2)} BYN`;
        if (res.includes('🪙') && Math.random() > 0.5 && freeSpins === 0) spinTalisman();
        else if (res.filter(s=>s===currentGame.scatter).length >= 3 && freeSpins === 0) showModal("БОНУС!", "10 ФРИСПИНОВ!", () => { freeSpins = 10; isPlaying = false; handlePlay(); });
        else if (freeSpins > 0) setTimeout(handlePlay, 1000);
        else { isPlaying = false; document.getElementById('spin-btn').disabled = false; }
        save(); updateUI();
    }

    function spinTalisman() {
        const idx = Math.floor(Math.random()*5);
        talRot += (360*5) + (360 - idx*72); document.getElementById('talisman-wheel').style.transform = `rotate(${talRot}deg)`;
        setTimeout(() => {
            if (idx >= 3) { freeSpins = (idx===3?10:15); showModal("ТАЛИСМАН", freeSpins+" ФРИСПИНОВ", () => { isPlaying = false; handlePlay(); }); }
            else { const p=[2, 5, 10]; balance += p[idx]*bets[betIdx]; isPlaying = false; document.getElementById('spin-btn').disabled = false; save(); updateUI(); }
        }, 3600);
    }

    function spinRoulette() {
        balance -= bets[betIdx]; const target = Math.floor(Math.random()*37);
        rouRot += (360*5) + (target*(360/37)); document.getElementById('rou-wheel').style.transform = `rotate(-${rouRot}deg)`;
        setTimeout(() => {
            const num = wheelNums[target]; let win = 0;
            const red = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
            if (rouBet==='red' && red.includes(num)) win = bets[betIdx]*2;
            else if (rouBet==='black' && num!==0 && !red.includes(num)) win = bets[betIdx]*2;
            else if (rouBet==='zero' && num===0) win = bets[betIdx]*36;
            balance += win; document.getElementById('win-tag').innerText = win>0? `WIN: ${win.toFixed(2)}` : `ВЫПАЛО: ${num}`;
            isPlaying = false; document.getElementById('spin-btn').disabled = false; save(); updateUI();
        }, 4100);
    }

    function closeModal() { document.getElementById('modal-overlay').style.display='none'; if(window.modalCb) window.modalCb(); }
    function showModal(t, m, cb) { document.getElementById('modal-title').innerText=t; document.getElementById('modal-text').innerText=m; document.getElementById('modal-overlay').style.display='flex'; window.modalCb = cb; }
    function save() { localStorage.setItem('casino_bal', balance); }
    function updateUI() { document.getElementById('balance').innerText = balance.toFixed(2); document.getElementById('display-bet').innerText = bets[betIdx].toFixed(2); }
    function exitGame() { if (!isPlaying) { document.getElementById('lobby').style.display = 'grid'; document.getElementById('game-screen').style.display = 'none'; } }
    updateUI();
</script>
</body>
</html>
